
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&family=Mochiy+Pop+P+One&family=Sour+Gummy&display=swap" rel="stylesheet">

    <link href="css/index.css" rel="stylesheet" type="text/css">

    <title>Sign Up</title>
</head>

<body>

<div id="container">

    <!-- Sidebar kiri -->
    <div class="navbar auth-side">
        <div class="auth-brand">Planner</div>

        <p class="auth-tagline">
            Plan your days, one small task at a time.
        </p>
    </div>

    <!-- Konten utama -->
    <div class="content auth-content">

        <div class="planner">SIGN UP</div>

        <form id="signupForm" class="auth-card signup-card" novalidate>

            <div class="auth-form-content">

                <h2>Create Your Account</h2>

                <p class="auth-description">
                    Start organizing your days with Planner.
                </p>

                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    minlength="3"
                    maxlength="50"
                    required
                >

                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password (min. 6 characters)</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="confirm">Confirm Password</label>
                <input
                    id="confirm"
                    name="confirm"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <p id="authMessage" class="auth-message" role="alert"></p>

                <button type="submit">Create Account</button>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>

            </div>

        </form>

    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
