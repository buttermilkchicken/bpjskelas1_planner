
services:
  db:
    image: mysql:8.0
    container_name: bpjskelas1-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - planner_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - planner_network

  backend:
    build: ./backend
    container_name: bpjskelas1-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - planner_network

  frontend:
    build: ./frontend
    container_name: bpjskelas1-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - planner_network

networks:
  planner_network:
    driver: bridge

volumes:
  planner_data:
